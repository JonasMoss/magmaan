name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layering:
    name: dependency layering + tracked content (fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check layering
        run: bash cpp/tests/tools/check_layering.sh
      - name: Check tracked content
        run: bash cpp/tests/tools/check_tracked_files.sh

  r-boundary:
    name: R boundary + vendor sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check vendored C++ sources
        run: |
          bash r-package/tools/vendor-cpp.sh
          status="$(git status --porcelain -- r-package/src)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r-package
          extra-packages: any::testthat
          needs: check

      - uses: extractions/setup-just@v2

      - name: Check both source packages (including live lavaan tests)
        run: just jobs=2 r-cmd-check "$RUNNER_TEMP/r-check" "$RUNNER_TEMP/r-library"

      - name: Upload R check diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r-cmd-check
          path: ${{ runner.temp }}/r-check/*.Rcheck

  build-gcc:
    defaults:
      run:
        working-directory: cpp
    # Compiler diversity, not redundancy. The -Werror set is strict enough that
    # GCC rejects code clang accepts (-Wmisleading-indentation is the one that
    # bit us), and `remotes::install_github` builds the vendored core with
    # whatever compiler R is configured with, which on most Linux distros and on
    # CRAN is g++. Library only: the point is the compile, and ctest under clang
    # already covers behaviour.
    name: build (Linux, gcc 13)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++

      - name: Configure
        run: cmake --preset default -DCMAKE_CXX_COMPILER=g++ -DMAGMAAN_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build --preset default --parallel 4

  build-test:
    defaults:
      run:
        working-directory: cpp
    # Clang 19 is the clang floor against libstdc++: Ubuntu 24.04's stock clang
    # 18 cannot use libstdc++'s <expected> (it needs the C++20 concepts level
    # clang reports only from 19), so take clang 19 from apt.llvm.org.
    name: build + ctest (Linux, clang 19)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build lsb-release wget gnupg software-properties-common
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 19
          rm llvm.sh

      - name: Configure
        run: cmake --preset default -DCMAKE_CXX_COMPILER=clang++-19 -DCMAKE_C_COMPILER=clang-19

      # Four jobs: some translation units need 1-3 GB each at -O0, and the
      # runner has 16 GB.
      - name: Build
        run: cmake --build --preset default --parallel 4

      - name: Test
        run: ctest --preset default
