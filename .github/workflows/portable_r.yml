name: Portable R packages

on:
  push:
    branches: [main, master]
    paths:
      - 'r-package/**'
      - 'r-magmaan/**'
      - '.github/workflows/portable_r.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: portable-r-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: R source packages (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-14 runners were retired (Nov 2026: "configuration not supported").
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      MAKEFLAGS: -j2
    steps:
      - uses: actions/checkout@v4
      - name: Select the C++23-capable macOS toolchain
        if: runner.os == 'macOS'
        run: |
          # Xcode 16 or later provides std::expected; keep the image default
          # when this pinned version is not installed.
          if [ -d /Applications/Xcode_16.2.app ]; then
            sudo xcode-select --switch /Applications/Xcode_16.2.app/Contents/Developer
          fi
          xcodebuild -version
          clang++ --version
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r-package
          extra-packages: |
            any::rcmdcheck
          needs: check
      - name: Check both packages against current dependencies
        shell: Rscript {0}
        run: |
          output <- file.path(Sys.getenv("RUNNER_TEMP"), "portable-check")
          dir.create(output, recursive = TRUE, showWarnings = FALSE)
          cat("lavaan: ", as.character(packageVersion("lavaan")), "\n", sep = "")
          rcmdcheck::rcmdcheck("r-package", check_dir = output,
                              args = "--no-manual", error_on = "warning")
          .libPaths(c(file.path(output, "magmaanlab.Rcheck"), .libPaths()))
          stopifnot(requireNamespace("magmaanlab", quietly = TRUE))
          Sys.setenv(R_LIBS = paste(.libPaths(), collapse = .Platform$path.sep))
          rcmdcheck::rcmdcheck("r-magmaan", check_dir = output,
                              args = "--no-manual", error_on = "warning")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-r-${{ matrix.os }}
          path: ${{ runner.temp }}/portable-check
